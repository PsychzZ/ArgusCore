repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.6
          - pydantic-settings>=2.2
          - types-pyyaml>=6.0
          - sqlalchemy>=2.0
          - httpx>=0.27
          - structlog>=24.1
          - fastapi>=0.110
          - uvicorn>=0.29
          - feedparser>=6.0
          - apscheduler>=3.10
          - lxml-stubs>=0.5
        args: [--strict, src/argus]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit)
        entry: uv run pytest tests/unit -x --ff
        language: system
        pass_filenames: false
        stages: [pre-commit]
